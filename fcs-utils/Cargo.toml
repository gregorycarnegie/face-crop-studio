[package]
name = "fcs-utils"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Shared utilities for the Face Crop Studio workspace."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytemuck.workspace = true
crc32fast.workspace = true
env_logger.workspace = true
fast_image_resize.workspace = true
image.workspace = true
imgref.workspace = true
log.workspace = true
pollster.workspace = true
ravif.workspace = true
rayon.workspace = true
rgb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
wgpu.workspace = true

[dependencies.csv]
workspace = true
optional = true

[dependencies.calamine]
workspace = true
optional = true

[dependencies.parquet]
workspace = true
optional = true

[dependencies.rusqlite]
workspace = true
optional = true

[dependencies.nokhwa]
workspace = true
optional = true

[dependencies.imagepipe]
workspace = true
optional = true

[dependencies.libheif-rs]
workspace = true
optional = true

[features]
# Test fixture helpers; enabled by dev-dependencies only so they stay out of release builds.
fixtures = []
mapping = ["dep:csv", "dep:calamine", "dep:parquet", "dep:rusqlite"]
webcam = ["dep:nokhwa"]
raw = ["dep:imagepipe"]
heic = ["dep:libheif-rs"]

[dev-dependencies]
tempfile.workspace = true
naga.workspace = true
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
metal.workspace = true
