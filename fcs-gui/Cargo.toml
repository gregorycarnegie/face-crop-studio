[package]
name = "fcs-gui"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
description = "Face Crop Studio — redesigned egui desktop application."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
csv.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras = { workspace = true, features = ["svg"] }
fcs-core.workspace = true
fcs-mapping.workspace = true
fcs-utils = { workspace = true, features = ["webcam", "raw", "heic"] }
image.workspace = true
imageproc.workspace = true
log.workspace = true
mimalloc.workspace = true
rayon.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

# Only the cfg(windows) branch of build.rs touches this, so it should not be
# compiled on the macOS and Linux release legs.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# `cargo-deb` packaging metadata. Asset paths are resolved relative to this
# Cargo.toml. The PNG is generated by `installer/linux/build_linux.sh` from
# the SVG logo before `cargo deb` runs; the model is downloaded by CI.
[package.metadata.deb]
name = "face-crop-studio"
maintainer = "Gregory Carnegie <gregory.carnegie+claude_ai@gmail.com>"
copyright = "2026, Gregory Carnegie. Licensed under MIT OR Apache-2.0."
license-file = ["../LICENSE-MIT", "0"]
extended-description = """\
Face Crop Studio is a GPU-accelerated face detection and batch portrait \
cropping tool built on YuNet, egui, and wgpu. It bundles the YuNet ONNX \
model and ships both a GUI and CLI."""
section = "graphics"
priority = "optional"
depends = "$auto, libc6 (>= 2.35)"
assets = [
    ["../target/release/fcs-gui", "usr/bin/", "755"],
    [
        "../models/scrfd80k_500m_640.onnx",
        "usr/share/face-crop-studio/models/",
        "644",
    ],
    [
        "../models/eye_refiner.onnx",
        "usr/share/face-crop-studio/models/",
        "644",
    ],
    [
        "../installer/linux/face-crop-studio.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "../installer/linux/face-crop-studio.png",
        "usr/share/icons/hicolor/256x256/apps/",
        "644",
    ],
    ["../samples/*.jpg", "usr/share/face-crop-studio/samples/", "644"],
    ["../samples/*.md", "usr/share/face-crop-studio/samples/", "644"],
    ["../README.md", "usr/share/doc/face-crop-studio/README.md", "644"],
]

# Selected by installer/linux/build_linux.sh only when an ONNX Runtime library
# has been fetched. cargo-deb asset lists are static and it fails on a missing
# file, so bundling unconditionally would force every local `cargo deb` to
# download the library first. The asset list is repeated rather than extended
# because a variant replaces the field rather than merging into it; `name` is
# restated so the produced package is identical apart from the extra file.
[package.metadata.deb.variants.bundled-ort]
name = "face-crop-studio"
assets = [
    ["../target/release/fcs-gui", "usr/bin/", "755"],
    [
        "../models/scrfd80k_500m_640.onnx",
        "usr/share/face-crop-studio/models/",
        "644",
    ],
    [
        "../models/eye_refiner.onnx",
        "usr/share/face-crop-studio/models/",
        "644",
    ],
    [
        "../installer/linux/face-crop-studio.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "../installer/linux/face-crop-studio.png",
        "usr/share/icons/hicolor/256x256/apps/",
        "644",
    ],
    ["../samples/*.jpg", "usr/share/face-crop-studio/samples/", "644"],
    ["../samples/*.md", "usr/share/face-crop-studio/samples/", "644"],
    ["../README.md", "usr/share/doc/face-crop-studio/README.md", "644"],
    # Beside the executable: fcs-ort looks there first, so this cannot be
    # shadowed by, or collide with, a distro-provided onnxruntime.
    ["../target/release/libonnxruntime.so", "usr/bin/", "644"],
]
