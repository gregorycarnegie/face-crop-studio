[package]
name = "fcs-safety"
version = "0.0.0"
edition = "2024"
publish = false

# Interpret the real CPU kernels without compiling GPU or native codec dependencies.
[workspace]

[dependencies]
# Not workspace-inherited (see above); keep in step with the root [workspace.dependencies].
anyhow = "1.0.104"
bytemuck = "1.25.2"
rayon = "1.12.0"
vstd = "=0.0.0-2026-11-08-0256"
wide = "1.7.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[dev-dependencies]
googletest = "0.14.4"
rstest = { version = "0.28.0", default-features = false }

[profile.release]
debug-assertions = false
overflow-checks = true
