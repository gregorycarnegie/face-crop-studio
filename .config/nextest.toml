[profile.default]
# Model loading and GPU parity tests take tens of seconds; past 5 minutes it is a
# hang (wedged wgpu adapter, stuck file lock), not slow work.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure in one run instead of stopping at the first.
fail-fast = false
failure-output = "immediate-final"
# GPU adapter acquisition is occasionally flaky on hosted runners.
retries = 1
