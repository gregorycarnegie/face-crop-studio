name: Verify model checksums
description: >
  Checks the ONNX models against their pinned SHA-256 digests. Both models are now fetched from
  release assets rather than regenerated from a public URL, so these digests are the only thing
  standing between a swapped upload and a shipped package. The same check runs in prepare-models
  (right after the fetch) and again in every release job (after the artifact download). Written
  in bash + sha256sum rather than Python because the windows-11-arm runner has no guaranteed
  Python, and this needs to work identically on all five release jobs.

inputs:
  models-dir:
    description: Directory holding the downloaded models.
    default: models
  scrfd-sha256:
    description: Expected digest of scrfd80k_500m_640.onnx, the detector. Empty skips the check.
    default: ""
  eye-refiner-sha256:
    description: Expected digest of eye_refiner.onnx. Empty skips the check, for jobs that do not need it.
    default: ""

runs:
  using: composite
  steps:
    - name: Verify model checksums
      shell: bash
      env:
        MODELS_DIR: ${{ inputs.models-dir }}
        EYE_REFINER_SHA256: ${{ inputs.eye-refiner-sha256 }}
        SCRFD_SHA256: ${{ inputs.scrfd-sha256 }}
      run: |
        set -euo pipefail
        # sha256sum --check needs "<digest>  <path>" lines; build them from the
        # pinned inputs so the digests stay declared in one place (release.yml).
        sums_file="$(mktemp)"
        {
          if [ -n "${SCRFD_SHA256}" ]; then
            echo "${SCRFD_SHA256}  ${MODELS_DIR}/scrfd80k_500m_640.onnx"
          fi
          if [ -n "${EYE_REFINER_SHA256}" ]; then
            echo "${EYE_REFINER_SHA256}  ${MODELS_DIR}/eye_refiner.onnx"
          fi
        } > "$sums_file"
        # Every digest empty means this step silently checked nothing, which is how a caller
        # that forgets to pass one would still go green. Fail instead.
        if [ ! -s "$sums_file" ]; then
          echo "verify-models: no digests were supplied, so nothing was checked" >&2
          exit 1
        fi
        sha256sum --check --strict "$sums_file"
