name: fcs-qt

# The Qt Quick front end, on the three platforms Face Crop Studio ships for, and the macOS and
# Linux release packages (fcs-qt with fcs-cli). Separate from ci.yml because fcs-qt is not a
# workspace member (it needs Qt, which the main legs don't install).
on:
  push:
    branches: [ "master" ]
    paths: &paths
      - "fcs-qt/**"
      - "fcs-cli/**"
      - "fcs-core/**"
      - "fcs-utils/**"
      - "fcs-mapping/**"
      - "assets/**"
      - "installer/**"
      - "Cargo.lock"
      - ".github/workflows/qt.yml"
      - ".github/actions/**"
  pull_request:
    branches: [ "master" ]
    paths: *paths
  workflow_dispatch:
  # release.yml runs this for the macOS and Linux release assets and the Windows Qt payload, so
  # they are built and checked exactly as on every push; with `release` the uploads are named for
  # its jobs, and the macOS package is signed when the Apple secrets are set.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  # 6.12, not 6.10: 6.10.3's qyieldcpu.h calls __yield() undeclared on arm64, which current
  # Xcode clang rejects; 6.12 uses __builtin_arm_yield. 6.12 needs MSVC 2022 on Windows.
  QT_VERSION: "6.12.0"
  # Keep in sync with ci.yml.
  EYE_REFINER_SHA256: 16b4ed6e42889c0eb3d6ce5068e399c19f12ad686bd121bcf959db34f8cef976
  EYE_REFINER_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-eye-refiner-v1.1/eye_refiner.onnx
  SCRFD_SHA256: 2437def9510f2af6431a5b2090ae9f357bc189cb0223be1b6c4d4ff085798e64
  SCRFD_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-scrfd-80k-v2.1/scrfd80k_500m_640.onnx

jobs:
  build:
    name: fcs-qt (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Evaluated once at job start, so the signing steps skip when the secret is not set.
      HAS_APPLE_SIGNING: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_CERT')] != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `slug` names the leg's checksums and artifact, as the release assets always have.
          - name: Windows
            os: windows-latest
            qt-arch: win64_msvc2022_64
            slug: windows
          - name: macOS
            os: macos-latest
            qt-arch: clang_64
            slug: macos-arm64
          # 24.04, not ci.yml's 22.04: Qt's own Linux binaries target newer distributions, so
          # the packages need what 24.04 has (dpkg-shlibdeps writes the .deb's minimum).
          - name: Linux
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            slug: linux-x86_64
          # aqtinstall needs the host named; it would otherwise look for x86_64 binaries.
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            slug: linux-arm64

    steps:
      - uses: actions/checkout@v7

      # The end-to-end test runs the real detector, so a missing model fails it rather than
      # skipping. Through the API, as ci.yml does (the public URL once served a cached 504).
      - name: Download models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          for url in "$EYE_REFINER_URL" "$SCRFD_URL"; do
            gh release download "$(basename "$(dirname "$url")")" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$url")" --dir models --clobber
          done

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      # The official binaries ship the private headers qtbridge includes.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          # aqtinstall 3.3.0, the latest release, cannot read Qt 6.11.2+'s repository layout;
          # its main branch can. Pinned to the commit that installed 6.12.0 for a local check.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7"

      # ── Native dependencies ──────────────────────────────────────────────
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # x64-windows-static-md, not ci.yml's static triplet: fcs-qt links Qt, which uses the
      # dynamic CRT, so its C libraries have to as well (see fcs-qt/README.md).
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\vcpkg\installed
          key: vcpkg-74f5ea45-dav1d-libheif-nohevc-de265-x64-windows-static-md

      - name: Install dav1d + libheif (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned, not the runner image's C:\vcpkg: an image update brought dav1d 1.5.4, whose
          # MSVC stdatomic.h fails on VS 18 (C7780 __has_include_next). 74f5ea45ca has dav1d 1.5.5.
          # ci.yml, qt.yml and release.yml pin the same commit; bump all three and the cache keys.
          $vcpkgCommit = '74f5ea45ca78988784b810ad9bbb148ea7ff76d8'
          if (-not (Test-Path "C:\vcpkg\.git")) { git clone https://github.com/microsoft/vcpkg C:\vcpkg }
          git -C C:\vcpkg fetch --quiet origin $vcpkgCommit
          git -C C:\vcpkg checkout --quiet --force $vcpkgCommit
          if ((git -C C:\vcpkg rev-parse HEAD) -ne $vcpkgCommit) { throw "vcpkg is not at $vcpkgCommit" }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & C:\vcpkg\vcpkg.exe install "dav1d:x64-windows-static-md" "libheif[core,libde265]:x64-windows-static-md"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        # A source build takes about a minute; it used to hang on an unlimited make -j (fixed in
        # the action). Time out so the log is kept and says where if it ever stalls again.
        timeout-minutes: 15
        uses: ./.github/actions/macos-build-deps

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      # ── Toolchain ────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # Both: the packages build fcs-cli from the root workspace.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            fcs-qt
            .
          key: ${{ matrix.os }}

      # ── Checks ───────────────────────────────────────────────────────────
      - name: Format
        if: matrix.name == 'Linux'
        run: cargo fmt --manifest-path fcs-qt/Cargo.toml -- --check

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fcs-qt/dev.ps1 test

      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fcs-qt/dev.ps1 clippy --all-targets '--' -D warnings

      - name: Test (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./fcs-qt/dev.sh test

      - name: Clippy (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./fcs-qt/dev.sh clippy --all-targets -- -D warnings

      # Fails on errors only: qmllint exits 0 on warnings, and the expected ones are
      # "unqualified access" to Studio, the Rust singleton it cannot see.
      - name: QML lint
        if: matrix.name == 'Linux'
        run: qmllint -I fcs-qt/src fcs-qt/src/fcs_qt/*.qml

      # The screens against a mock Studio serving the real settings (fcs-qt/tests/qml).
      - name: QML tests
        if: matrix.name == 'Linux'
        run: ./fcs-qt/tests/qml/run.sh

      # ── Packages ─────────────────────────────────────────────────────────
      # A release build plus Qt's deploy tool, then a 20 s run of the result with Qt off PATH.
      # Not on pull requests: it adds a release build per leg.
      - name: Package (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./fcs-qt/packaging/package.ps1
          ./fcs-qt/packaging/smoke.ps1 fcs-qt/dist/face-crop-studio-qt-windows-x86_64/fcs-qt.exe

      # The unpacked folder, for release.yml's Windows job to add fcs-cli and build the zip,
      # MSI, setup.exe and MSIX from.
      - name: Upload Windows payload
        if: runner.os == 'Windows' && inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-payload
          path: fcs-qt/dist/face-crop-studio-qt-windows-x86_64
          if-no-files-found: error
          retention-days: 1

      # The packaged app driven through UI Automation: six photos, every face found, all of them
      # exported through the real folder dialog, and a clean shutdown.
      - name: End-to-end (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: ./fcs-qt/packaging/e2e.ps1 fcs-qt/dist/face-crop-studio-qt-windows-x86_64/fcs-qt.exe

      - name: End-to-end screenshots
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: fcs-qt-e2e-failure
          path: ${{ runner.temp }}/fcs-qt-e2e-*/failure-*.png
          if-no-files-found: ignore

      # The release MSI (installer/windows/wix), from the folder above; then installed,
      # smoke-tested from Program Files and removed again. Unsigned while the repository has no
      # certificates. release.yml builds the shipped one from the same folder plus fcs-cli.
      - name: MSI (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet tool install -g wix --version 7.0.0
          wix -acceptEula wix7 extension add WixToolset.UI.wixext/7.0.0
          # Face Crop Studio's version, which the About box shows too.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msi = "$env:RUNNER_TEMP\face-crop-studio.msi"
          wix build -acceptEula wix7 -arch x64 -d SourceDir="$PWD\fcs-qt\dist\face-crop-studio-qt-windows-x86_64" `
            -d MsiVersion="$version" -ext WixToolset.UI.wixext -o $msi installer\windows\wix\Product.wxs
          if ($LASTEXITCODE) { throw "wix build failed ($LASTEXITCODE)" }

          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($install.ExitCode) { Get-Content msi-install.log -Tail 40; throw "install failed ($($install.ExitCode))" }
          $installed = "$env:ProgramFiles\Face Crop Studio\fcs-qt.exe"
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Face Crop Studio\Face Crop Studio.lnk")) { throw 'no Start menu shortcut' }
          ./fcs-qt/packaging/smoke.ps1 $installed
          $remove = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($remove.ExitCode) { throw "uninstall failed ($($remove.ExitCode))" }
          if (Test-Path $installed) { throw 'uninstall left fcs-qt.exe behind' }

      # The release setup.exe and Store package, built from the same folder by the same scripts
      # release.yml uses; each is installed, run and removed. The MSIX is signed with a throwaway
      # certificate named like the Store publisher; the Store re-signs real uploads.
      - name: setup.exe and MSIX (Windows)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $dist = "$PWD\fcs-qt\dist\face-crop-studio-qt-windows-x86_64"

          choco install nsis --no-progress -y
          $setup = "$env:RUNNER_TEMP\face-crop-studio-setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DAPP_VERSION=$version" "/DDIST_DIR=$dist" `
            "/DOUT_FILE=$setup" installer\windows\face-crop-studio.nsi
          if ($LASTEXITCODE) { throw "makensis failed ($LASTEXITCODE)" }
          $dir = "$env:ProgramFiles\Face Crop Studio"
          # Installed over fcs-gui 2.x's files (2.x's release layout), as an upgrade from 2.x is:
          # its uninstaller must remove those too.
          New-Item -ItemType Directory -Force "$dir\samples" | Out-Null
          foreach ($f in 'fcs-gui.exe', 'fcs-cli.exe', 'app_icon.ico', 'README.md', 'LICENSE', 'LICENSE-MIT', 'samples\sample_01.jpg', 'samples\README.md') {
            Set-Content "$dir\$f" 'fcs-gui 2.x'
          }
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "setup.exe failed ($($p.ExitCode))" }
          # The NSIS script keeps the default shell context, so its shortcuts are the installing user's.
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Face Crop Studio\Face Crop Studio.lnk")) { throw 'no Start menu shortcut' }
          ./fcs-qt/packaging/smoke.ps1 "$dir\fcs-qt.exe"
          # NSIS's uninstaller copies itself to %TEMP% and returns at once; _?= keeps it in place.
          $p = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed ($($p.ExitCode))" }
          # Run in place, the uninstaller cannot delete itself; anything else is left behind.
          $left = Get-ChildItem $dir -Recurse -Force | Where-Object Name -ne 'Uninstall.exe'
          if ($left) { throw "uninstall left $($left.Count) items behind, e.g. $($left[0].FullName)" }
          Remove-Item $setup

          $payload = "$env:RUNNER_TEMP\msix-payload"
          New-Item -ItemType Directory -Force $payload | Out-Null
          New-Item -ItemType Junction -Path "$payload\x86_64" -Target $dist | Out-Null
          ./installer/windows/msix/build_msix.ps1 -Version $version -PayloadRoot $payload `
            -OutDir "$env:RUNNER_TEMP\msix"
          $msix = (Get-ChildItem "$env:RUNNER_TEMP\msix\*-x64.msix").FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix)
          $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())
          $identity = ([xml]$reader.ReadToEnd()).Package.Identity
          $reader.Close(); $zip.Dispose()
          $cert = New-SelfSignedCertificate -Type Custom -Subject $identity.Publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\ci.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)" }
          Add-AppxPackage $msix
          $package = Get-AppxPackage -Name $identity.Name
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!FaceCropStudio"
          Start-Sleep 20
          $running = Get-Process fcs-qt -ErrorAction SilentlyContinue
          if (-not $running) { throw 'the installed MSIX did not start, or exited within 20 s' }
          $running | Stop-Process -Force
          Remove-AppxPackage $package.PackageFullName
          'setup.exe and MSIX: ok'

      # The version: a tag's for a release run (so an rc is named as one), else the workspace's.
      # xcb-cursor0 is installed so linuxdeploy bundles it: Qt's xcb plugin needs it and many
      # desktops lack it. xvfb gives the smoke run a display.
      - name: Package (Linux)
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 xvfb
          ./fcs-qt/packaging/package.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          APPIMAGE_EXTRACT_AND_RUN=1 ./fcs-qt/packaging/smoke.sh \
            xvfb-run -a "$(ls "$PWD"/fcs-qt/dist/*.AppImage)"
          # The .deb as a user gets it: installed with its dependencies, run from PATH.
          sudo apt-get install -y ./fcs-qt/dist/*.deb
          ./fcs-qt/packaging/smoke.sh xvfb-run -a fcs-qt

      - name: Import Developer ID certificate (macOS)
        # Only on a release run with the certificate configured: a temporary keychain codesign
        # picks it up from; package.sh selects the identity by APPLE_DEVELOPER_ID_NAME.
        if: runner.os == 'macOS' && inputs.release && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_CERT')] }}
          APPLE_DEVELOPER_ID_PASS: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_PASS')] }}
          KEYCHAIN_PASS: ${{ github.run_id }}-keychain
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          echo -n "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_PASS" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      # libheif and dav1d are static (macos-build-deps). The checks fail if anything in the bundle
      # still points into Homebrew, or either executable loads anything from outside macOS and
      # the bundle.
      - name: Package (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_DEVELOPER_ID_NAME: ${{ inputs.release && secrets[format('{0}', 'APPLE_DEVELOPER_ID_NAME')] || '' }}
          APPLE_NOTARIZE_USER: ${{ inputs.release && secrets[format('{0}', 'APPLE_NOTARIZE_USER')] || '' }}
          APPLE_NOTARIZE_PASS: ${{ inputs.release && secrets[format('{0}', 'APPLE_NOTARIZE_PASS')] || '' }}
          APPLE_TEAM_ID: ${{ inputs.release && secrets[format('{0}', 'APPLE_TEAM_ID')] || '' }}
        run: |
          brew install librsvg create-dmg   # rsvg-convert for the icon; the DMG's layout
          ./fcs-qt/packaging/package.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          app="fcs-qt/dist/Face Crop Studio.app"
          if find "$app" -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -L {} + 2>/dev/null | grep /opt/homebrew; then
            echo "the bundle still loads libraries from Homebrew (above)" >&2; exit 1
          fi
          for bin in "$app"/Contents/MacOS/fcs-qt "$app"/Contents/MacOS/fcs-cli; do
            if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/|@)'; then
              echo "$bin loads a library from outside the bundle (above)" >&2; exit 1
            fi
          done
          ./fcs-qt/packaging/smoke.sh "$PWD/$app/Contents/MacOS/fcs-qt"

      - uses: mlugg/setup-zig@v2
        if: runner.os != 'Windows' && github.event_name != 'pull_request'
        with:
          version: 0.17.0

      # fcs-cli from the package finds the bundled detector and crops a sample, with no ONNX
      # Runtime. The .deb's /usr/bin links are absolute, so its copy is checked under /opt.
      - name: Verify packaged inference without ONNX Runtime
        if: runner.os != 'Windows' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            App="fcs-qt/dist/Face Crop Studio.app"
            zig run tools/verify_package.zig -- "$App" "$App/Contents/MacOS/fcs-cli" "$App/Contents/Resources/samples/sample_01.jpg"
          else
            AppDir="fcs-qt/dist/face-crop-studio.AppDir"
            zig run tools/verify_package.zig -- "$AppDir" "$AppDir/usr/bin/fcs-cli" "$AppDir/usr/share/face-crop-studio/samples/sample_01.jpg"
            DebDir="$RUNNER_TEMP/fcs-deb-smoke"
            mkdir -p "$DebDir"
            dpkg-deb -x fcs-qt/dist/*.deb "$DebDir"
            Opt="$DebDir/opt/face-crop-studio"
            zig run tools/verify_package.zig -- "$Opt" "$Opt/bin/fcs-cli" "$Opt/share/face-crop-studio/samples/sample_01.jpg"
          fi

      - name: Checksums
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: fcs-qt/dist
        run: |
          shopt -s nullglob
          # Git Bash on Windows has only sha256sum, macOS only shasum.
          sum="$(command -v sha256sum || echo 'shasum -a 256')"
          $sum *.zip *.AppImage *.deb *.dmg > "SHA256SUMS-${{ matrix.slug }}.txt"
          cat SHA256SUMS-*.txt

      # release.yml's publish job collects every "*-release-artifacts*" upload. Windows' release
      # assets come from release.yml's own job (the payload above plus fcs-cli).
      - name: Upload package
        if: github.event_name != 'pull_request' && !(inputs.release && runner.os == 'Windows')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release && format('qt-release-artifacts-{0}', matrix.slug) || format('fcs-qt-{0}', matrix.slug) }}
          path: |
            fcs-qt/dist/SHA256SUMS-*.txt
            fcs-qt/dist/*.zip
            fcs-qt/dist/*.AppImage
            fcs-qt/dist/*.deb
            fcs-qt/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
