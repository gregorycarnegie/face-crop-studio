name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep these checksums in sync with ci.yml.
  YUNET_ORIGINAL_SHA256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
  YUNET_640_SHA256: d2c5a887db77802389261b13d2b9f5e1171b9d5787cb315d0add225812ff4d96
  # The eye refiner cannot be regenerated from a public URL the way YuNet can -- it is our
  # own export (tools/dataset/export_eye_refiner.py), so it is fetched from a release asset
  # and this digest is the only thing standing between a swapped upload and a shipped build.
  EYE_REFINER_SHA256: b01dd218b46a7466eb13125b011e81b57e2e2e252794c403029db1d7c7628e76
  EYE_REFINER_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-eye-refiner-v1/eye_refiner.onnx
  # The detector trained on this project's own data (tools/dataset/SCRFD_80K.md). Like the
  # refiner it cannot be regenerated from a public URL, so it is fetched and checksummed.
  SCRFD_SHA256: 337dab7db27401fc35f1d48baa737f552d25e3198f62533038467d39e0d7a00b
  SCRFD_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-scrfd-80k-v1/scrfd80k_500m_640.onnx

jobs:
  shader-validation:
    name: Validate WGSL shaders
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdav1d-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Validate WGSL shaders
        run: cargo test -p fcs-utils validate_all_wgsl_files

  prepare-models:
    name: Prepare Release Models
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Download and process models
        shell: bash
        run: |
          mkdir -p models
          curl -L -o models/face_detection_yunet_2023mar.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          uvx --python 3.11 --with onnxsim==0.4.36 --with onnxruntime onnxsim models/face_detection_yunet_2023mar.onnx models/face_detection_yunet_2023mar_640.onnx --overwrite-input-shape "1,3,640,640" \
            || uvx --python 3.11 --with onnxsim==0.4.36 --with onnxruntime onnxsim models/face_detection_yunet_2023mar.onnx models/face_detection_yunet_2023mar_640.onnx --input-shape "1,3,640,640"
          curl -fsSL -o models/eye_refiner.onnx "$EYE_REFINER_URL"
          curl -fsSL -o models/scrfd80k_500m_640.onnx "$SCRFD_URL"

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          original-sha256: ${{ env.YUNET_ORIGINAL_SHA256 }}
          simplified-sha256: ${{ env.YUNET_640_SHA256 }}
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      - name: Upload prepared models
        uses: actions/upload-artifact@v4
        with:
          name: release-models
          path: |
            models/face_detection_yunet_2023mar.onnx
            models/face_detection_yunet_2023mar_640.onnx
            models/eye_refiner.onnx
            models/scrfd80k_500m_640.onnx
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Windows Release Artifacts (${{ matrix.arch }})
    needs: [shader-validation, prepare-models]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # A matrix of one, kept deliberately: Windows arm64 is blocked upstream,
      # not abandoned, and re-adding it is a matter of restoring the entry below
      # rather than re-parameterising the whole job.
      #
      # tract-linalg (0.23.4, latest as of 2026-08) does not support
      # aarch64-pc-windows-msvc. Its build script special-cases x86_64+Windows
      # to assemble with ml64.exe, but the aarch64 branch calls cc::Build
      # unconditionally, which resolves to cl.exe — and cl.exe silently ignores
      # the GNU-syntax .S kernels (warning D9024/D9027), so lib.exe then fails
      # with LNK1181 on the .o files that were never produced. There is no
      # feature or env var to skip the assembly. Windows-on-Arm runs the x86_64
      # build under emulation until this is fixed upstream.
      #
      #   - arch: arm64
      #     runner: windows-11-arm
      #     vcpkg-triplet: arm64-windows-static
      #     wix-arch: arm64
      #     rustflags: -C target-feature=+crt-static
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            vcpkg-triplet: x64-windows-static
            wix-arch: x64
            # Repeated from .cargo/config.toml on purpose: setting RUSTFLAGS in
            # the environment makes cargo ignore [target.*.rustflags] entirely,
            # so target-cpu has to be restated here or the shipped binaries
            # quietly lose x86-64-v3.
            rustflags: -C target-feature=+crt-static -C target-cpu=x86-64-v3
    env:
      # Evaluated once at job start; used by signing steps to skip gracefully
      # when the certificate secret is not configured.
      HAS_CODE_SIGN: ${{ secrets.CODE_SIGN_PFX != '' }}
      DIST_NAME: face-crop-studio-windows-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Download prepared models
        uses: actions/download-artifact@v4
        with:
          name: release-models
          path: models

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          original-sha256: ${{ env.YUNET_ORIGINAL_SHA256 }}
          simplified-sha256: ${{ env.YUNET_640_SHA256 }}
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install NSIS
        # Guard kept for when arm64 returns: NSIS ships an x86 makensis and
        # produces an x86 installer stub, so an arm64 leg would ship an emulated
        # installer. The MSI and the Store package cover that platform instead.
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

      - name: Install WiX v7
        shell: pwsh
        run: |
          dotnet tool install -g wix --version 7.0.0
          wix -acceptEula wix7 extension add WixToolset.UI.wixext/7.0.0

      - name: Install pkg-config
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y

      - name: Install NASM
        # mozjpeg-sys assembles libjpeg-turbo's SIMD kernels with NASM, and when NASM is
        # absent it prints a warning, compiles jsimd_none.c and carries on -- so the build
        # still succeeds and the binary is silently ~2x slower at JPEG work. nokhwa decodes
        # webcam MJPEG frames through it, so that reaches shipped behaviour. The verify step
        # is the point: without it this regresses the next time the runner image changes.
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify NASM is on PATH
        shell: pwsh
        run: |
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) { throw "nasm not on PATH; libjpeg-turbo would fall back to scalar C" }
          nasm -v

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          # Triplet is in the key: both runners report runner.os == "Windows",
          # so without it the arm64 job restores x64 static libs. "nohevc"
          # marks the package set below — the cache service prefix-matches keys,
          # so a key must not be able to match a cache built from a different
          # package set.
          key: vcpkg-dav1d-libheif-nohevc-${{ matrix.vcpkg-triplet }}

      - name: Install dav1d + libheif (vcpkg)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          # libheif[core] means "no default features". The only default is
          # `hevc`, which is HEVC *encoding* via x265 — the app only ever
          # decodes HEIC (fcs-utils load_heic_image), and the HEVC decoder
          # libde265 is a base dependency of the port, so decoding is
          # unaffected. Pulling x265 in also breaks the link outright:
          # x265's threadpool.cpp calls Win32 registry APIs and nothing in the
          # graph links Advapi32, giving LNK2019 on __imp_RegQueryValueExA.
          # This matches installer-side Linux, which already builds with
          # -DWITH_LIBDE265=ON -DWITH_X265=OFF.
          & C:\vcpkg\vcpkg.exe install `
            "dav1d:${{ matrix.vcpkg-triplet }}" `
            "libheif[core]:${{ matrix.vcpkg-triplet }}"

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          PKG_CONFIG_PATH: C:\vcpkg\installed\${{ matrix.vcpkg-triplet }}\lib\pkgconfig
          PKG_CONFIG_ALL_STATIC: "1"
          # libheif-sys finds libheif through the `vcpkg` crate, not pkg-config.
          VCPKG_ROOT: C:\vcpkg
        run: cargo build --release -p fcs-cli -p fcs-gui

      - name: Sign release binaries
        # Requires CODE_SIGN_PFX (base64-encoded PFX) and CODE_SIGN_PASSWORD
        # to be set as repository secrets. Skipped silently if absent.
        if: env.HAS_CODE_SIGN == 'true'
        shell: pwsh
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $CertPath = "$env:TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX))

          $SignTool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $SignTool) { throw "signtool.exe not found" }

          foreach ($bin in @("target\release\fcs-cli.exe", "target\release\fcs-gui.exe")) {
            & $SignTool sign /fd SHA256 /f $CertPath /p $env:CODE_SIGN_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 `
              /d "Face Crop Studio" $bin
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $bin" }
          }

          Remove-Item $CertPath -Force

      - name: Fetch ONNX Runtime
        shell: pwsh
        env:
          # The minor version IS the ONNX Runtime API version, and it must be at
          # least fcs_ort::REQUIRED_API_VERSION or fcs-ort rejects the library and
          # silently drops to the slower built-in graph. The smoke test after
          # packaging is what actually catches a mismatch.
          ORT_VERSION: "1.24.4"
        run: |
          $Zip = "$env:RUNNER_TEMP/onnxruntime.zip"
          $Url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"
          Invoke-WebRequest -Uri $Url -OutFile $Zip
          Expand-Archive -Path $Zip -DestinationPath "$env:RUNNER_TEMP/ort" -Force
          $OrtDir = (Get-ChildItem "$env:RUNNER_TEMP/ort" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$OrtDir/lib/onnxruntime.dll")) {
            throw "onnxruntime.dll not found under $OrtDir"
          }
          "ORT_DIR=$OrtDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package artifacts
        shell: pwsh
        run: |
          $DistName = $env:DIST_NAME
          $DistDir = "dist/$DistName"
          $OrtDir = $env:ORT_DIR
          New-Item -ItemType Directory -Force -Path $DistDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$DistDir/models" | Out-Null

          Copy-Item target/release/fcs-cli.exe "$DistDir/fcs-cli.exe"
          Copy-Item target/release/fcs-gui.exe "$DistDir/fcs-gui.exe"
          Copy-Item fcs-gui/assets/app_icon.ico "$DistDir/app_icon.ico"
          Copy-Item models/face_detection_yunet_2023mar_640.onnx "$DistDir/models/face_detection_yunet_2023mar_640.onnx"
          Copy-Item models/eye_refiner.onnx "$DistDir/models/eye_refiner.onnx"
          Copy-Item models/scrfd80k_500m_640.onnx "$DistDir/models/scrfd80k_500m_640.onnx"
          if (Test-Path samples) {
            Copy-Item -Recurse samples "$DistDir/samples"
          }
          if (Test-Path README.md) {
            Copy-Item README.md "$DistDir/README.md"
          }
          if (Test-Path LICENSE) {
            Copy-Item LICENSE "$DistDir/LICENSE"
          }
          if (Test-Path LICENSE-APACHE) {
            Copy-Item LICENSE-APACHE "$DistDir/LICENSE-APACHE"
          }
          if (Test-Path LICENSE-MIT) {
            Copy-Item LICENSE-MIT "$DistDir/LICENSE-MIT"
          }

          Copy-Item "$OrtDir/lib/onnxruntime.dll" "$DistDir/onnxruntime.dll"
          Copy-Item "$OrtDir/LICENSE" "$DistDir/LICENSE-onnxruntime"

          Compress-Archive -Path "$DistDir/*" -DestinationPath "dist/$DistName.zip" -Force

      - name: Verify packaged model path
        shell: pwsh
        run: |
          $ModelPaths = @(
            "dist/$env:DIST_NAME/models/face_detection_yunet_2023mar_640.onnx",
            "dist/$env:DIST_NAME/models/eye_refiner.onnx",
            "dist/$env:DIST_NAME/models/scrfd80k_500m_640.onnx"
          )
          foreach ($ModelPath in $ModelPaths) {
            if (-not (Test-Path $ModelPath)) {
              Write-Error "Expected packaged model missing at $ModelPath"
              exit 1
            }
          }

      - name: Verify the packaged build uses ONNX Runtime
        shell: pwsh
        # Running the packaged binary is the only check that covers every way
        # this can silently degrade: a missing DLL, one placed where fcs-ort does
        # not look, a version older than REQUIRED_API_VERSION, or a missing
        # dependency of the DLL itself. Each of those falls back to the built-in
        # CPU graph and ships quietly ~3x slower, so a hard failure is wanted.
        run: |
          $DistDir = "dist/$env:DIST_NAME"
          if (-not (Test-Path "$DistDir/onnxruntime.dll")) {
            throw "onnxruntime.dll missing from the package"
          }
          $env:RUST_LOG = "info"
          $Out = & "$DistDir/fcs-cli.exe" --input "$DistDir/samples/sample_01.jpg" `
                   --output-dir "$env:RUNNER_TEMP/ort-smoke" --no-gpu 2>&1 | Out-String
          Write-Host $Out
          # Matches "Detector: <model> on onnxruntime". The model name is deliberately not
          # pinned: either detector on ONNX Runtime is a correct package, and this check is
          # about the runtime, whose absence degrades silently to the ~3x slower built-in graph.
          # It caught its own staleness once -- the log line used to read "Detection backend:
          # onnxruntime" and the rename slipped past every local check, because nothing but a
          # tagged build runs this.
          if ($Out -notmatch "Detector: .+ on onnxruntime") {
            throw "packaged build did not select ONNX Runtime; it fell back to another backend"
          }

      - name: Build NSIS installer
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          if ($Version.StartsWith("v")) { $Version = $Version.Substring(1) }

          $DistDir = Join-Path $PWD "dist\$env:DIST_NAME"
          $OutFile = Join-Path $PWD "dist\$env:DIST_NAME-setup.exe"
          $Script = Join-Path $PWD "installer\windows\face-crop-studio.nsi"
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"

          $Makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $Makensis) {
            $Candidates = @(
              "$env:ProgramFiles(x86)\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe",
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            foreach ($Candidate in $Candidates) {
              if (Test-Path $Candidate) {
                $Makensis = $Candidate
                break
              }
            }
          }
          if (-not $Makensis) {
            throw "makensis.exe not found after NSIS installation"
          }

          & $Makensis /DAPP_VERSION=$Version /DDIST_DIR="$DistDir" /DOUT_FILE="$OutFile" "$Script"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $OutFile)) {
            throw "Installer missing at $OutFile"
          }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $RawVersion = "${{ github.ref_name }}"
          if ($RawVersion.StartsWith("v")) { $RawVersion = $RawVersion.Substring(1) }
          $MsiVersion = $RawVersion.Split("-")[0]
          if ($MsiVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid MSI version '$MsiVersion' derived from tag '${{ github.ref_name }}'"
          }

          $DistDir = Join-Path $PWD "dist\$env:DIST_NAME"
          $MsiOut = Join-Path $PWD "dist\$env:DIST_NAME.msi"
          Write-Host "Using MSI version: $MsiVersion"

          # WiX v7: single 'wix build' replaces heat + candle + light.
          # -arch marks all harvested components for the target platform (no XML
          # patching needed); ProgramFiles64Folder resolves correctly for arm64.
          # <Files> in Product.wxs harvests SourceDir instead of the old heat.exe step.
          wix build `
            -acceptEula wix7 `
            -arch ${{ matrix.wix-arch }} `
            -d SourceDir="$DistDir" `
            -d MsiVersion="$MsiVersion" `
            -ext WixToolset.UI.wixext `
            -o "$MsiOut" `
            installer\windows\wix\Product.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $MsiOut)) { throw "MSI missing at $MsiOut" }

      - name: Generate checksums
        shell: bash
        # One checksum file per platform+arch. A single shared SHA256SUMS.txt
        # would be overwritten by whichever release job uploaded last, leaving
        # most assets unverifiable.
        run: |
          set -euo pipefail
          cd dist
          # setup.exe only exists on the x86_64 leg, so build the list from what
          # is actually present rather than failing on the missing NSIS output.
          files=("$DIST_NAME.zip" "$DIST_NAME.msi")
          [ -f "$DIST_NAME-setup.exe" ] && files+=("$DIST_NAME-setup.exe")
          sha256sum "${files[@]}" > "SHA256SUMS-windows-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-windows-${{ matrix.arch }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts-${{ matrix.arch }}
          # Globs rather than literal names so the arm64 leg, which has no NSIS
          # setup.exe, does not report a missing file on every run.
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
            dist/SHA256SUMS-windows-${{ matrix.arch }}.txt

      - name: Upload MSIX payload
        # The unpacked dist directory, consumed by the msix-package job. Kept
        # separate from the release artifacts above because it is an
        # intermediate, not something a user downloads.
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-payload-${{ matrix.arch }}
          path: dist/${{ env.DIST_NAME }}
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          # Any tag with a suffix (v1.5.1-rc1) is a release candidate.
          # Without this every RC publishes as a full release and becomes
          # the repo's "Latest", which is what users and the
          # releases/latest API endpoint see.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
            dist/SHA256SUMS-windows-${{ matrix.arch }}.txt

  msix-package:
    name: MSIX Store Package
    needs: [windows-release]
    # Packaging only — makeappx can bundle any architecture's payload from an
    # x64 host, so this does not need its own matrix. Currently that means an
    # x86_64-only bundle; see the windows-release matrix for why. Windows still
    # installs it on Arm devices and runs it under emulation.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Downloads every payload the windows-release matrix produced. Written as
      # a pattern rather than one step per architecture so that adding an arch
      # back to the matrix needs no change here — and so a single missing arch
      # cannot skip the whole Store package, which is what happened when this
      # job hard-required both x86_64 and arm64.
      - name: Download Windows payloads
        uses: actions/download-artifact@v4
        with:
          pattern: windows-msix-payload-*
          path: dist/windows

      - name: Normalise payload directory names
        # download-artifact names each directory after the artifact, so
        # "windows-msix-payload-x86_64" has to become the "x86_64" arch slug
        # that build_msix.ps1 looks for.
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -Directory |
            Where-Object { $_.Name -like 'windows-msix-payload-*' } |
            ForEach-Object {
              $arch = $_.Name -replace '^windows-msix-payload-', ''
              Rename-Item $_.FullName -NewName $arch
              Write-Host "payload: $arch"
            }

      - name: Build MSIX bundle
        shell: pwsh
        env:
          # Repository variables, so the Partner Center identity can be rotated
          # without a code change. build_msix.ps1 falls back to the committed
          # defaults when they are unset.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $RawVersion = "${{ github.ref_name }}"
          if ($RawVersion.StartsWith("v")) { $RawVersion = $RawVersion.Substring(1) }
          $Version = $RawVersion.Split("-")[0]
          if ($Version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid MSIX version '$Version' derived from tag '${{ github.ref_name }}'"
          }
          ./installer/windows/msix/build_msix.ps1 `
            -Version $Version `
            -PayloadRoot dist/windows `
            -OutDir dist/msix

      - name: Upload MSIX artifacts
        # Workflow artifact only, not a GitHub release asset: the bundle is
        # deliberately unsigned (the Store signs it), so it is not installable
        # by end users and would only confuse the releases page.
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-package
          path: dist/msix/*
          if-no-files-found: error

  store-submit:
    name: Submit to Microsoft Store
    needs: [msix-package]
    runs-on: windows-latest
    # Skipped entirely until MSSTORE_PRODUCT_ID is set as a repository variable.
    # Tag-only: a workflow_dispatch run has no release version to submit.
    #
    # Prerelease tags are excluded on purpose. MSIX versions drop the suffix
    # (v1.5.1-rc1 and v1.5.1 both become 1.5.1.0), and the Store permanently
    # refuses a version it has already accepted — so submitting an RC would burn
    # the version number the real release needs. RC tags still build the package;
    # they just stop short of publishing it.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-')
      && vars.MSSTORE_PRODUCT_ID != ''

    steps:
      - name: Download MSIX package
        uses: actions/download-artifact@v4
        with:
          name: msix-store-package
          path: dist/msix

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish to Microsoft Store
        shell: pwsh
        run: |
          $Upload = Get-ChildItem dist/msix/*.msixupload | Select-Object -First 1
          if (-not $Upload) { throw "No .msixupload found in dist/msix" }
          Write-Host "Publishing $($Upload.Name) to product ${{ vars.MSSTORE_PRODUCT_ID }}"
          # Package path as the positional argument, matching Microsoft's own
          # GitHub Actions example. If the CLI rejects it, the equivalent
          # explicit form is: msstore publish -i "<path>" -id "<productId>".
          msstore publish "$($Upload.FullName)" -id ${{ vars.MSSTORE_PRODUCT_ID }}

  macos-release:
    name: macOS Release Artifacts (Apple Silicon)
    needs: [shader-validation, prepare-models]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Evaluated once at job start so signing/notarization steps can skip
      # gracefully when the Apple secrets aren't configured.
      HAS_APPLE_SIGNING: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_CERT')] != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download prepared models
        uses: actions/download-artifact@v4
        with:
          name: release-models
          path: models

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          original-sha256: ${{ env.YUNET_ORIGINAL_SHA256 }}
          simplified-sha256: ${{ env.YUNET_640_SHA256 }}
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          # dav1d + pkg-config: AVIF decode support (mirrors the Windows vcpkg setup).
          # libheif: HEIC/HEIF decode (brew ships a recent libheif for libheif-rs).
          # librsvg: rsvg-convert for SVG → PNG iconset generation.
          # create-dmg: drag-to-Applications DMG layout.
          # nasm: mozjpeg-sys assembles libjpeg-turbo's SIMD with it and silently falls
          # back to scalar C when it is missing (see the Windows leg for why that matters).
          brew install dav1d libheif pkg-config librsvg create-dmg nasm

      - name: Build release binary (aarch64-apple-darwin)
        run: cargo build --release -p fcs-gui --target aarch64-apple-darwin

      - name: Fetch ONNX Runtime
        env:
          # Minor version == the ONNX Runtime API version, and must be at least
          # fcs_ort::REQUIRED_API_VERSION or fcs-ort rejects the library and
          # silently falls back to the slower built-in graph. Only an arm64
          # build is published for this release, which is all this job targets.
          ORT_VERSION: "1.24.4"
        run: |
          set -euo pipefail
          Url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
          curl -fsSL -o /tmp/onnxruntime.tgz "$Url"
          mkdir -p /tmp/ort && tar -xzf /tmp/onnxruntime.tgz -C /tmp/ort --strip-components=1
          # The archive ships a versioned dylib plus symlinks; resolve to the
          # real file so the bundle gets a file rather than a dangling link,
          # which would also fail codesign.
          Lib="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' /tmp/ort/lib/libonnxruntime.dylib)"
          test -f "$Lib"
          echo "FCS_ORT_LIB=$Lib" >> "$GITHUB_ENV"
          echo "Using $Lib"

      - name: Import Developer ID certificate
        # Mirrors the Windows signing pattern: only runs if the cert secret is
        # configured. Imports the .p12 into a temporary keychain so codesign
        # picks it up, then the build script uses APPLE_DEVELOPER_ID_NAME to
        # select the identity.
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_CERT')] }}
          APPLE_DEVELOPER_ID_PASS: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_PASS')] }}
          KEYCHAIN_PASS: ${{ github.run_id }}-keychain
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          echo -n "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_PASS" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Build .app bundle and DMG
        env:
          APPLE_DEVELOPER_ID_NAME: ${{ secrets[format('{0}', 'APPLE_DEVELOPER_ID_NAME')] }}
          APPLE_NOTARIZE_USER: ${{ secrets[format('{0}', 'APPLE_NOTARIZE_USER')] }}
          APPLE_NOTARIZE_PASS: ${{ secrets[format('{0}', 'APPLE_NOTARIZE_PASS')] }}
          APPLE_TEAM_ID: ${{ secrets[format('{0}', 'APPLE_TEAM_ID')] }}
        run: |
          RawVersion="${{ github.ref_name }}"
          Version="${RawVersion#v}"
          bash installer/macos/build_macos.sh "$Version"

      - name: Verify the packaged bundle uses ONNX Runtime
        # Mirrors the Windows and Linux checks. Every way this degrades is
        # silent — a missing dylib, one where fcs-ort does not look, a version
        # below REQUIRED_API_VERSION, an unmet dependency — and each falls back
        # to the built-in graph, shipping ~3x slower with no error. fcs-gui
        # needs a display, so the loader is exercised through fcs-ort's own
        # suite against the exact dylib that was bundled.
        run: |
          set -euo pipefail
          Dylib="dist/macos/Face Crop Studio.app/Contents/MacOS/libonnxruntime.dylib"
          test -f "$Dylib"
          ORT_DYLIB_PATH="$Dylib" \
            cargo test --release -p fcs-ort --test end_to_end -- --nocapture

      - name: Generate checksums
        shell: bash
        run: |
          cd dist/macos
          shasum -a 256 *.dmg > SHA256SUMS-macos-arm64.txt
          cat SHA256SUMS-macos-arm64.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: |
            dist/macos/*.dmg
            dist/macos/SHA256SUMS-macos-arm64.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          # Any tag with a suffix (v1.5.1-rc1) is a release candidate.
          # Without this every RC publishes as a full release and becomes
          # the repo's "Latest", which is what users and the
          # releases/latest API endpoint see.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/macos/*.dmg
            dist/macos/SHA256SUMS-macos-arm64.txt

  linux-release:
    name: Linux Release Artifacts (${{ matrix.arch }})
    needs: [shader-validation, prepare-models]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on 22.04 for broad glibc compatibility (binaries link against
          # glibc 2.35 and run on Ubuntu 22.04+ and other modern distros).
          - arch: x86_64
            runner: ubuntu-22.04
            appimagetool-arch: x86_64
            # Microsoft's archive slug, which differs from both of the above.
            ort-arch: x64
          - arch: arm64
            # Free for public repositories, same glibc baseline as the x64 leg.
            runner: ubuntu-22.04-arm
            appimagetool-arch: aarch64
            ort-arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Download prepared models
        uses: actions/download-artifact@v4
        with:
          name: release-models
          path: models

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          original-sha256: ${{ env.YUNET_ORIGINAL_SHA256 }}
          simplified-sha256: ${{ env.YUNET_640_SHA256 }}
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      - name: Install build dependencies
        uses: ./.github/actions/linux-build-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: |
          cargo install cargo-deb --locked --version 3.7.0
          cargo deb --version

      - name: Install appimagetool
        # Extract instead of running directly so we don't need FUSE on the runner.
        env:
          APPIMAGETOOL_ARCH: ${{ matrix.appimagetool-arch }}
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Build release binary
        run: cargo build --release -p fcs-gui

      - name: Fetch ONNX Runtime
        env:
          # Minor version == the ONNX Runtime API version, and must be at least
          # fcs_ort::REQUIRED_API_VERSION or fcs-ort rejects the library and
          # silently falls back to the slower built-in graph.
          ORT_VERSION: "1.24.4"
          ORT_ARCH: ${{ matrix.ort-arch }}
        run: |
          set -euo pipefail
          Url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}.tgz"
          curl -fsSL -o /tmp/onnxruntime.tgz "$Url"
          mkdir -p /tmp/ort && tar -xzf /tmp/onnxruntime.tgz -C /tmp/ort --strip-components=1
          # The archive ships a versioned .so plus symlinks; resolve to the real
          # file so the copy into the package is a file, not a dangling link.
          Lib="$(readlink -f /tmp/ort/lib/libonnxruntime.so)"
          test -f "$Lib"
          echo "FCS_ORT_LIB=$Lib" >> "$GITHUB_ENV"
          echo "Using $Lib"

      - name: Build AppImage and .deb
        # build_linux.sh derives the arch slug from uname -m, so both legs use
        # the same invocation. FCS_ORT_LIB is picked up from the environment.
        run: |
          RawVersion="${{ github.ref_name }}"
          Version="${RawVersion#v}"
          bash installer/linux/build_linux.sh "$Version"
          ls -lh dist/linux

      - name: Verify the packaged build uses ONNX Runtime
        # Running the packaged binary is the only check covering every way this
        # degrades silently: a missing library, one where fcs-ort does not look,
        # a version below REQUIRED_API_VERSION, or an unmet dependency of the
        # library itself. Each falls back to the built-in graph and ships ~3x
        # slower with no error.
        run: |
          set -euo pipefail
          AppDir="dist/linux/face-crop-studio.AppDir"
          test -f "$AppDir/usr/bin/libonnxruntime.so"
          # fcs-gui needs a display; fcs-ort's own suite exercises the loader
          # against the very library that was packaged, which is the part at risk.
          ORT_DYLIB_PATH="$AppDir/usr/bin/libonnxruntime.so" \
            cargo test --release -p fcs-ort --test end_to_end -- --nocapture

      - name: Generate checksums
        shell: bash
        run: |
          cd dist/linux
          sha256sum *.AppImage *.deb > "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-linux-${{ matrix.arch }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts-${{ matrix.arch }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/SHA256SUMS-linux-${{ matrix.arch }}.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          # Any tag with a suffix (v1.5.1-rc1) is a release candidate.
          # Without this every RC publishes as a full release and becomes
          # the repo's "Latest", which is what users and the
          # releases/latest API endpoint see.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/SHA256SUMS-linux-${{ matrix.arch }}.txt
