name: CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "docs/**"
      - "tag-release.bat"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "docs/**"
      - "tag-release.bat"
  # Manual re-run, matching release.yml. Pushes made while Actions is degraded
  # are not retriggered once it recovers, and without this the only way to
  # re-run CI on an unchanged tree is an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"
  # Match the runtime shipped by release.yml.
  ORT_VERSION: "1.24.4"
  # Keep these checksums and URLs in sync with release.yml.
  EYE_REFINER_SHA256: b01dd218b46a7466eb13125b011e81b57e2e2e252794c403029db1d7c7628e76
  EYE_REFINER_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-eye-refiner-v1/eye_refiner.onnx
  SCRFD_SHA256: f31f1f01ca33d24184059bba0627a54b8351e6f2b167474a4d71f2361ea53c39
  SCRFD_URL: https://github.com/gregorycarnegie/face-crop-studio/releases/download/models-scrfd-80k-v2/scrfd80k_500m_640.onnx

jobs:
  # Fetch and verify the models once, then hand them to every platform leg as an artifact.
  # Both are this project's own exports, fetched from release assets: no Python and no onnxsim,
  # which were only needed to re-export YuNet from opencv_zoo.
  #
  # The test legs run with FCS_STRICT_TESTS=1, which turns "model missing, skipping" into a
  # failure, so a leg without these cannot quietly pass having checked nothing --
  # tests/scrfd_parity.rs is the one that would.
  # The installer scripts only ever execute inside a release build, so a typo in one is
  # invisible until a tag is pushed -- and then it has already published a half-built release.
  # That happened with v2.0.0: an edit left an orphaned `exit 1` in build_macos.sh, which
  # exited in 0.1 s with no output after Linux and Windows had uploaded their artifacts.
  # `bash -n` catches exactly that, in a second, on every push.
  installers:
    name: Check Installer Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every shell script
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r script; do
            echo "checking $script"
            bash -n "$script"
            found=$((found + 1))
          done < <(find installer tools -name '*.sh' -type f | sort)
          # A silent zero would mean the glob stopped matching and this checked nothing.
          if [ "$found" -eq 0 ]; then
            echo "no shell scripts found -- this check is not checking anything" >&2
            exit 1
          fi
          echo "$found script(s) parsed"

  models:
    name: Prepare Models
    runs-on: ubuntu-latest
    steps:
      # Only needed for the local verify-models composite action below.
      - uses: actions/checkout@v4

      - name: Download models
        shell: bash
        run: |
          mkdir -p models
          curl -fsSL -o models/eye_refiner.onnx "$EYE_REFINER_URL"
          curl -fsSL -o models/scrfd80k_500m_640.onnx "$SCRFD_URL"

      - name: Verify model checksums
        uses: ./.github/actions/verify-models
        with:
          eye-refiner-sha256: ${{ env.EYE_REFINER_SHA256 }}
          scrfd-sha256: ${{ env.SCRFD_SHA256 }}

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: ci-models
          path: models
          retention-days: 1

  build:
    name: Build and Test (${{ matrix.name }})
    needs: models
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, not just the first to break.
      fail-fast: false
      matrix:
        include:
          # Windows carries the coverage gate. It used to be described as the only
          # leg reaching the wgpu code paths; it never was (macOS runs Metal), and
          # since lavapipe went in below, every leg does.
          - name: Windows
            os: windows-latest
            coverage: true
            vcpkg-triplet: x64-windows-static
            # Restated from .cargo/config.toml because RUSTFLAGS in the
            # environment makes cargo ignore [target.*.rustflags] outright.
            # Must match release.yml or CI validates different codegen than
            # the shipped binaries.
            rustflags: -C target-feature=+crt-static -C target-cpu=x86-64-v3
          # No Windows ARM64 leg: tract-linalg cannot build for
          # aarch64-pc-windows-msvc (its GNU-syntax .S kernels are handed to
          # cl.exe, which ignores them). release.yml carries the full
          # explanation. Linux ARM64 below is unaffected and builds natively.
          - name: macOS
            os: macos-latest
            ort-platform: osx-arm64
            ort-library: libonnxruntime.dylib
          # 22.04 matches the release job's glibc baseline, so a link error here
          # is the same link error the release build would hit.
          - name: Linux
            os: ubuntu-22.04
            ort-platform: linux-x64
            ort-library: libonnxruntime.so
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            ort-platform: linux-aarch64
            ort-library: libonnxruntime.so

    steps:
      - uses: actions/checkout@v4

      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: ci-models
          path: models

      # ── Native dependencies ──────────────────────────────────────────────
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          # Triplet, not runner.os, so an arch-blind key cannot hand an arm64
          # leg x64 static libs. "nohevc" marks the package set below; the cache
          # service prefix-matches keys, so a key must not be able to match a
          # cache built from a different package set.
          key: vcpkg-dav1d-libheif-nohevc-${{ matrix.vcpkg-triplet }}

      - name: Install dav1d + libheif (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }
          # libheif[core] drops the `hevc` default feature (x265, an *encoder*
          # the app never uses) which otherwise fails the link with LNK2019 on
          # __imp_RegQueryValueExA. See release.yml for the full reasoning; the
          # two must stay in step or CI validates a different library set than
          # the one that ships.
          & C:\vcpkg\vcpkg.exe install `
            "dav1d:${{ matrix.vcpkg-triplet }}" `
            "libheif[core]:${{ matrix.vcpkg-triplet }}"

      - name: Export build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Write to GITHUB_ENV so this persists for all subsequent steps,
          # overriding any PATH entries added by Python toolcache setup.
          # dav1d is found via pkg-config; libheif-sys uses the `vcpkg` crate, which
          # needs VCPKG_ROOT and only picks the matching -static triplet under crt-static.
          @(
            "PKG_CONFIG_PATH=C:\vcpkg\installed\${{ matrix.vcpkg-triplet }}\lib\pkgconfig"
            "PKG_CONFIG_ALL_STATIC=1"
            "VCPKG_ROOT=C:\vcpkg"
            "RUSTFLAGS=${{ matrix.rustflags }}"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dav1d + libheif (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          # brew ships versions new enough for both crates, so unlike Linux there
          # is nothing to build from source here.
          brew install dav1d libheif pkg-config

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      # A software Vulkan adapter, so the Linux legs run the GPU tests instead of
      # skipping every one of them. Mesa's lavapipe runs compute shaders on the CPU:
      # it says nothing about speed or vendor drivers, but it checks every WGSL
      # shader and dispatch on Vulkan, beside WARP (D3D12) on Windows and Metal on
      # macOS. Here rather than in linux-build-deps, which release.yml shares and
      # which has no use for it. The apt lists were refreshed by the step above.
      - name: Install lavapipe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Fetch ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Zip = "$env:RUNNER_TEMP/onnxruntime.zip"
          $Name = "onnxruntime-win-x64-$env:ORT_VERSION"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$Name.zip" -OutFile $Zip
          Expand-Archive -Path $Zip -DestinationPath "$env:RUNNER_TEMP/ort" -Force
          $Lib = "$env:RUNNER_TEMP/ort/$Name/lib/onnxruntime.dll"
          if (-not (Test-Path $Lib)) { throw "ONNX Runtime missing at $Lib" }
          "ORT_DYLIB_PATH=$Lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch ONNX Runtime (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ORT_PLATFORM: ${{ matrix.ort-platform }}
          ORT_LIBRARY: ${{ matrix.ort-library }}
        run: |
          set -euo pipefail
          Name="onnxruntime-${ORT_PLATFORM}-${ORT_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/onnxruntime.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${Name}.tgz"
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/onnxruntime.tgz" -C "$RUNNER_TEMP/ort"
          Lib="$RUNNER_TEMP/ort/$Name/lib/$ORT_LIBRARY"
          test -f "$Lib"
          echo "ORT_DYLIB_PATH=$Lib" >> "$GITHUB_ENV"

      # ── Toolchain ────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt, llvm-tools-preview

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      # ── Checks ───────────────────────────────────────────────────────────
      - name: Check
        run: cargo check --workspace

      # FCS_STRICT_TESTS turns "model/fixture missing, skipping" into a failure:
      # the models arrive via artifact, the runtime is downloaded above, and
      # the sample images are in-tree, so a skip here
      # means a broken path, not an unavailable asset. GPU-dependent tests still
      # self-skip when no adapter is present, which is right on a developer's
      # machine and wrong here: every leg has one (WARP, Metal, lavapipe). So
      # FCS_REQUIRE_GPU makes a missing adapter fail one test, instead of letting
      # a leg that lost it report the same green as one that ran them all.
      - name: Test with coverage
        if: matrix.coverage
        # One instrumented run, not a second pass: `cargo llvm-cov nextest` wraps the same
        # nextest invocation. The nextest profile has to travel via NEXTEST_PROFILE because
        # `--profile` on the command line belongs to cargo-llvm-cov (build profile).
        #
        # The 65% floor sits a few points under the current 68.9% line coverage: ordinary
        # refactors should not turn the pipeline red, but deleting a test module or landing
        # a large untested file will. Raise it as coverage climbs, don't lower it.
        #
        # `|| status=$?` rather than letting the pipeline fail outright, so the job summary
        # still records the number on the very run that tripped the gate.
        shell: bash
        env:
          FCS_STRICT_TESTS: "1"
          FCS_REQUIRE_GPU: "1"
          NEXTEST_PROFILE: ci
        run: |
          status=0
          cargo llvm-cov nextest --workspace --all-features \
            --summary-only --fail-under-lines 65 | tee coverage.txt || status=$?
          {
            echo '### Coverage'
            echo '```'
            grep -E '^(Filename|TOTAL)' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Test
        if: '!matrix.coverage'
        shell: bash
        env:
          FCS_STRICT_TESTS: "1"
          FCS_REQUIRE_GPU: "1"
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace --all-features

      - name: Test docs
        run: cargo test --workspace --all-features --doc

      # Formatting is platform-independent, so one leg is enough. Pinned to the
      # x86_64 Linux runner specifically, since there are now two Linux legs.
      - name: Format
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      # Clippy runs everywhere: the cfg(target_os) blocks in fcs-utils and
      # fcs-gui are only linted on the platform that compiles them.
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
