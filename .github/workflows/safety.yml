name: CPU Safety and Parser Fuzzing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-08-24

jobs:
  miri:
    name: Miri CPU buffers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tree Borrows handles Crossbeam's aliasing; its deferred global cleanup leaks.
      # Keep memory validity and race checks enabled.
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri, rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/safety/Cargo.toml -- --check
      - name: Check production kernels
        # Debug mode pre-fills buffers with NaN, hiding uninitialized writes from Miri.
        run: cargo miri test --locked --manifest-path tools/safety/Cargo.toml --release miri_cpu_buffers -- --test-threads=1

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [onnx_initializers, metadata, metadata_roundtrip, color]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Check formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      # Each run starts from what earlier runs found instead of from the seeds alone.
      # actions/cache only saves on success, so a crashing input never becomes the corpus.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target, where
      # ASan cannot link, so name the runner's gnu target explicitly.
      - name: Fuzz with AddressSanitizer
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=30 -max_len=16384 -timeout=5 -rss_limit_mb=512
      - name: Save crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7
