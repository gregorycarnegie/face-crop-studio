[package]
name = "fcs-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
description = "Face Crop Studio core — ONNX model inference, preprocessing, and postprocessing."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
fcs-ort.workspace = true
fcs-utils.workspace = true
image.workspace = true
imageproc.workspace = true
log.workspace = true
prost.workspace = true
rayon.workspace = true
serde.workspace = true
wgpu.workspace = true

[dev-dependencies]
# Dev-only: tract no longer runs inference, but it remains the independent
# oracle the other backends are checked against — it interprets the ONNX graph
# rather than re-implementing it, and can be stopped at a named node to validate
# a single GPU op. Nothing it provides reaches a shipped binary.
tract-onnx.workspace = true
criterion.workspace = true
# Dev-only: lets the profiling examples switch on the runtime's `timing_guard` lines.
env_logger.workspace = true
mimalloc.workspace = true
fcs-utils = { workspace = true, features = ["fixtures"] }
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
mozjpeg.workspace = true

[[bench]]
name = "preprocessing"
harness = false

[[bench]]
name = "inference_pipeline"
harness = false

[[bench]]
name = "crop_enhance"
harness = false

[[bench]]
name = "conv2d_benchmark"
harness = false
