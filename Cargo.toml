[profile.release]
lto = true
codegen-units = 1
# "unwind" (not "abort") so the catch_unwind panic-safety in batch processing
# (fcs-gui run_batch_job_panic_safe) actually works in shipped builds: a single
# undecodable file is skipped instead of aborting the whole app.
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
# Dependencies are built at opt-level 3, so full debuginfo buys little (locals are
# optimized out) but roughly doubles every PDB. Line tables keep file:line in
# backtraces. Measured: fcs-gui.pdb 515 MB -> 288 MB, and a `cargo test --no-run`
# after touching fcs-core 86-92 s -> 65-80 s. Workspace crates keep full debuginfo.
debug = "line-tables-only"

[workspace]
members = ["fcs-core", "fcs-utils", "fcs-mapping", "fcs-ort", "fcs-cli", "fcs-gui"]
resolver = "3"

[workspace.package]
edition = "2024"
# Matches the toolchain pinned in ci.yml and release.yml. With resolver 3 this
# also makes dependency resolution MSRV-aware, so `cargo update` will not pull
# in a version that needs a newer rustc than the workflows install.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
version = "1.8.0"
description = "Face Crop Studio — pure Rust face detection and cropping."

# Lint policy lives here rather than only in `clippy -- -D warnings` in CI, so a
# local `cargo clippy` sees exactly what the pipeline sees. Members opt in with
# `lints.workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# `missing_docs` is enabled in fcs-core and fcs-utils via crate attributes.
# Keep it per-crate until the remaining workspace crates are documented;
# CI's `-D warnings` enforces coverage for the opted-in libraries.

[workspace.lints.clippy]
# priority -1 so individual lint overrides added later win over the group.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Workspace crates
fcs-core = { path = "fcs-core" }
fcs-mapping = { path = "fcs-mapping" }
fcs-ort = { path = "fcs-ort" }
fcs-utils = { path = "fcs-utils" }

# Error handling and logging
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
thiserror = "2.0.20"

# CLI and desktop UI
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", features = ["wgpu"] }
egui = "0.36.2"
egui_extras = "0.36.2"
# Test-only harness that drives a real egui app. Kept in lockstep with egui.
egui_kittest = "0.36.2"
rfd = "0.17.2"
# Filesystem events for the CLI's --watch mode. Thin wrapper over the platform
# APIs (ReadDirectoryChangesW / inotify / FSEvents); the event loop around it is
# ours, because a create event fires before the file finishes being written.
notify = "8.2.0"

# Image processing and graphics
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
# libjpeg-turbo. Pulled in transitively by nokhwa regardless, so naming it directly
# adds no native build cost. Needs NASM at build time or it silently drops to scalar C.
mozjpeg = "0.10.13"
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "png",
    "jpeg",
    "webp",
    "tiff",
    "bmp",
    "avif",
    "avif-native",
    "rayon",
] }
# default-features = false matters more than it looks: imageproc's own `default`
# feature contains "image/default", which turns every image codec back on and
# silently defeats the curated feature list above. Only `geometric_transformations`
# and `rect` are used, so `text` (ab_glyph) and `fft` (rustdct) go too.
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }
imgref = "1.12.3"
# Pure-Rust camera RAW decode (demosaic + sRGB); pulls its own image 0.24 internally.
imagepipe = "0.5.1"
# HEIC/HEIF decode via system libheif (no pure-Rust HEVC decoder exists under a
# permissive license). Located through pkg-config, same as dav1d for AVIF.
libheif-rs = "3.0.0"
ravif = { version = "0.13.0", default-features = false, features = [
    "threading",
] }
rgb = "0.8.53"
tiny-skia = "0.12.0"

# Machine learning and numeric processing
bytemuck = { version = "1.25.2", features = ["derive"] }
prost = "0.14.4"
# Dynamic loading of the ONNX Runtime library, used by fcs-ort.
libloading = "0.9.0"

# GPU and shader support
metal = "0.33.0"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out"] }
pollster = "1.0.1"
wgpu = "30.0.1"

# Camera and platform integration
nokhwa = { version = "0.10.11", features = ["input-native"] }
# One feature per module actually imported from. They are hierarchical — e.g.
# `Win32_System_ProcessStatus` pulls in `Win32_System_Threading` — so several
# could be dropped and still compile; they are listed explicitly because the code
# names them directly, and an implicit parent is not a promise.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",                 # SYSTEMTIME, HGLOBAL
    "Win32_Graphics_Dxgi",              # IDXGIFactory4/IDXGIAdapter3 VRAM query
    "Win32_System_DataExchange",        # PNG clipboard format
    "Win32_System_Memory",              # GlobalLock/GlobalSize for clipboard data
    "Win32_System_ProcessStatus",       # K32GetProcessMemoryInfo
    "Win32_System_SystemInformation",   # GetLocalTime
    "Win32_System_Threading",           # GetCurrentProcess
] }
winresource = "0.1.31"

# Data formats and storage
base64 = "0.23.1"
calamine = "0.36.1"
crc32fast = "1.5.2"
csv = "1.4.0"
parquet = { version = "60.0.0", default-features = false, features = [
    "arrow",
    "flate2",
    "flate2-zlib-rs",
    "lz4",
    "snap",
    "zstd",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Concurrency and utilities
# Global allocator for the shipped binaries. The ~third it cut off single-image detection was
# measured against tract, which allocated and freed a tensor per graph node per inference: on
# the Windows system heap those large blocks are decommitted on free and re-fault on the next
# run, which profiling put at ~25% of a detection. tract is gone, but `scrfd::plan` allocates
# per step the same way, so the reason should still hold — unmeasured since the swap.
mimalloc = "0.1.52"
rayon = "1.12.0"
walkdir = "2.5.0"

# Testing and benchmarking
assert_cmd = "2.2.2"
criterion = "0.8.2"
proptest = "1.11.0"
tempfile = "3.27.0"
# Builds .xlsx fixtures in tests. Already present via calamine, so keep default features
# off — they would add aes, bzip2, lzma and friends for compression the fixtures never use.
zip = { version = "8.6.0", default-features = false }
