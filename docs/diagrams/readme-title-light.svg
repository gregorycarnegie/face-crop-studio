<svg xmlns="http://www.w3.org/2000/svg" width="320" height="44" viewBox="0 0 320 44">
  <!-- README title (light theme). GitHub strips inline colour from README HTML, so the logo-orange "Crop" needs an image. -->
  <defs>
    <linearGradient id="logo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dc6114"/>
      <stop offset="1" stop-color="#fe8d1c"/>
    </linearGradient>
  </defs>
  <text x="160" y="33" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Face <tspan fill="url(#logo)">Crop</tspan> Studio</text>
</svg>
