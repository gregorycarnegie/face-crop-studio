[package]
name = "fcs-qt"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Face Crop Studio — experimental Qt Quick front end (Qt Bridge for Rust)."

# Standalone, not a workspace member: it needs Qt 6.10+ with qmake on PATH, which the CI
# runners do not have, and CI builds with `--workspace`. Build with
# `cargo run --manifest-path fcs-qt/Cargo.toml`.
[workspace]

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
env_logger = "0.11.11"
fcs-core = { path = "../fcs-core" }
# "heic" needs libheif for vcpkg's x64-windows-static-md triplet on Windows (see README).
fcs-utils = { path = "../fcs-utils", features = ["raw", "heic"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
qtbridge = { version = "0.4.1", features = ["serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Compile cpp/image_provider.cpp against Qt; both already come in through cxx-qt.
[build-dependencies]
cc = "1.0.100"
qt-build-utils = "0.10.0"

# Same reasoning as the main workspace: dependencies at opt-level 3 so detection and
# enhancement are not debug-slow in `cargo run`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
