[package]
name = "fcs-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
description = "Face Crop Studio CLI — batch face detection and cropping."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fcs-core.workspace = true
fcs-mapping.workspace = true
fcs-utils = { workspace = true, features = ["webcam", "raw", "heic"] }
image.workspace = true
imageproc.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
fcs-utils = { workspace = true, features = ["fixtures"] }
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true

# Only the cfg(windows) branch of build.rs touches this, so it should not be
# compiled on the macOS and Linux release legs.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
