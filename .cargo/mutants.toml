# cargo-mutants configuration.
#
# Exclusions keep the reported score meaningful: mutating code that no test
# currently reaches only inflates the missed count and buries the gaps that are
# actually worth closing.

# Without this, cargo-mutants builds with default features, and `webcam`, `raw`
# and `heic` are all opt-in. Their modules are `#[cfg(feature = ...)]`, so the
# mutant lands in a file the build skips, the suite passes, and it is recorded
# as missed no matter how well tested the code is.
#
# Measured on what is now `fcs-mapping/src/sqlite.rs` (then behind the `mapping`
# feature), 31 mutants, identical tests either way:
#   default features   0 caught, 31 missed
#   --all-features    27 caught,  2 missed, 1 timeout, 1 unviable
#
# That silently misreported roughly 94 mutants across mapping (70, since split
# out into `fcs-mapping` and no longer feature-gated), webcam (17) and the
# heic/raw loaders in image_utils.
all_features = true

# The scratch copy must include gitignored inputs: `fixtures/images/` (the
# detection corpus) and the 320 model. Without them the model- and
# fixture-driven tests skip themselves, pass, and every mutant they guard is
# recorded as missed. `target/` is governed by `copy_target`, not this.
gitignore = false

exclude_globs = [
    # egui immediate-mode UI: painting, layout, and widget state only exist
    # inside a live frame. 1608 mutants, 8 caught at the time this was written.
    #
    # `egui_kittest` (https://github.com/emilk/egui/tree/main/crates/egui_kittest)
    # does let tests drive a real egui app; `ui/widgets.rs`, `ui/toolbar.rs` and
    # `ui/menubar.rs` now drive one through `ui/test_support.rs`. Measured result
    # on widgets.rs: 23 of 116 viable mutants caught, 20%. The split is sharp and
    # worth knowing before repeating the experiment:
    #
    #   caught  — return values, click routing, state mutation, format strings
    #   missed  — every paint parameter: colours, corner radii, stroke widths,
    #             text offsets. `gpu_pill`, `ctl_pill`, `tb_sep` and
    #             `field_label` return nothing and only paint, so even
    #             "replace <fn> with ()" survives.
    #
    # Killing paint mutants needs kittest's `snapshot`/`wgpu` features and
    # committed baseline images. Until that call is made, the painting modules
    # stay excluded so the reported score is not dominated by pixels no assertion
    # looks at. Run with `--no-config` to measure them anyway.
    #
    # `fcs-gui/src/interaction/` is deliberately NOT excluded: it is pure hit
    # testing and clamping arithmetic with no egui frame involved, it sits at
    # 100% line coverage, and its mutants are exactly the kind worth reporting.
    "fcs-gui/src/ui/**",
    "fcs-gui/src/core/**",
    "fcs-gui/src/rendering/**",
    # app.rs, types.rs, theme.rs, lib.rs, main.rs — the crate-root modules.
    "fcs-gui/src/*.rs",

    # These two genuinely need hardware in the loop: an enumerable camera and a
    # wgpu adapter. Every mutant survives because the code never runs in CI.
    "fcs-cli/src/webcam.rs",
    "fcs-cli/src/gpu.rs",
    # Same reason as the CLI's webcam module: the capture tests are #[ignore]d
    # without a camera, so its mutants all survive.
    "fcs-utils/src/webcam.rs",
]

# The auto timeout is baseline_test_time * 5, and the baseline runs alone while
# the mutants run four-wide against one GPU. Measured September 2026: fcs-utils
# baselined at 5.3 s (timeout 27 s) but its slowest *passing* mutant took 17.4 s,
# and fcs-core baselined at 11.4 s (timeout 57 s) with a passing mutant at 42.5 s.
# A timeout reads as a missed mutant, so one caused by contention is a silent
# loss. 120 s clears the measured tail on every package.
#
# A FAILED line in a timed-out mutant's log does not mean the timeout was
# contention. `cargo test` exits only when the whole binary does, so one test can
# fail while another, under the same mutant, never ends. Three mutants looked
# "caught, just slow" and were expected to clear at 120 s. One did
# (`apply_raster_mask_optimized`'s `4 * width`). The other two did not, and the
# 2026-09-24 run showed why: `load_jpeg_exif`'s `index + 2` -> `- 2` makes the
# segment walker stop advancing on short segments (a real loop), and
# `calculate_crop_region`'s `out_h > 0.0` -> `>=`/`==` makes a zero-height aspect
# infinite, so a test grinds through a u32::MAX-wide region (46 s alone, idle).
# To tell which, find the test in the log that never reports.
#
# The genuine hangs stop here too; they just cost 90 s more each, which is
# minutes across a run measured in hours. As of that run all six remaining
# timeouts are genuine: `wait_for_gpu` (x2) with nothing polling,
# `GpuStatusIndicator::pending` recursing through `Default`, and the three above.
minimum_test_timeout = 120

# ---------------------------------------------------------------------------
# Known survivors, verified 2026-09-24. A full run should miss exactly these;
# anything else in missed.txt is new and needs a look. Listed rather than put in
# `exclude_re`, because a name-based exclusion cannot tell two same-shaped
# mutants in one function apart (apply_enhancements has four `> -> >=`: two
# below, two killed) and a line-based one goes stale silently.
#
# Equivalent -- no test can tell them from the original:
#
#   `| -> ^` on wgpu::BufferUsages (GpuTensor::to_vec, tensor_usage x2,
#     create_uniform_buffer): every flag is one distinct bit, so A|B == A^B.
#   apply_nms_in_place `len < 200` (<=, ==, >): picks naive or grid NMS, and
#     `grid_nms_matches_naive_reference` (proptest) pins them equal.
#   apply_nms_naive `keep + 1 -> keep * 1`: the kept box also suppresses itself,
#     but a kept box's flag is never read again and the list is truncated to keep.
#   scrfd preprocess `ratio > 1 -> >=`: both arms give the same pair at 1.0
#     (pinned, with the reasoning, in its own test).
#   apply_enhancements / WgpuEnhancer::apply, skin `amount > 0 -> >=` and
#     sharpening `combined > 0 -> >=`: skin smoothing and unsharp at amount 0 are
#     exact identities (checked on pixels, not assumed).
#   background_blur_from_rgba `< / > -> <= / >=` at 0.81 and 1.21: the blend
#     weight is 0 or 1 exactly there, matching the branch the mutant takes.
#   skin_smooth_rgba `y + dy`, `x + dx` -> `-`: a symmetric kernel over a
#     symmetric range visits the same neighbours with the same weights.
#   laplacian_variance `w > 512`, `h > 512` -> `>=`: at exactly 512 the fit is
#     the image's own size, and that Triangle resize is an identity (checked).
#   laplacian_variance `sum += -> -=`: the variance uses only the mean squared.
#   best_fit_index `< -> <=`: breaks a tie between interchangeable buffers.
#   pixel_adjust FLAG_EXPOSURE `1 << 0 -> 1 >> 0`: both are 1.
#   load_jpeg_exif `index + 4 < len -> <=`: the extra iteration still reads in
#     range, and any EXIF segment there would overrun and break.
#   TempFile::keep -> (): after the rename the temp path is gone, so Drop's
#     remove_file fails with NotFound and is ignored.
#
# Not measurable on this host, which is not the same as equivalent:
#
#   get_vram_macos (x3): macOS only; neither Windows nor WSL can run it.
#   <impl Drop for Environment/Session>::drop -> (): skips ReleaseEnv and
#     ReleaseSession -- a native-handle leak no functional test can see. Killing
#     them needs a fake OrtApi table (21 non-nullable extern fns) to count
#     releases, which is more test than the two lines it guards.
#   encode_path (x2 per platform): each variant only compiles on its own OS.
#     The Windows one is caught here; the unix one is caught in WSL.
