# cargo-mutants configuration.
#
# Exclusions keep the reported score meaningful: mutating code that no test
# currently reaches only inflates the missed count and buries the gaps that are
# actually worth closing.

# Without this, cargo-mutants builds with default features, and `webcam`, `raw`
# and `heic` are all opt-in. Their modules are `#[cfg(feature = ...)]`, so the
# mutant lands in a file the build skips, the suite passes, and it is recorded
# as missed no matter how well tested the code is.
#
# Measured on what is now `fcs-mapping/src/sqlite.rs` (then behind the `mapping`
# feature), 31 mutants, identical tests either way:
#   default features   0 caught, 31 missed
#   --all-features    27 caught,  2 missed, 1 timeout, 1 unviable
#
# That silently misreported roughly 94 mutants across mapping (70, since split
# out into `fcs-mapping` and no longer feature-gated), webcam (17) and the
# heic/raw loaders in image_utils.
all_features = true

# The scratch copy must include gitignored inputs: `fixtures/images/` (the
# detection corpus) and the 320 model. Without them the model- and
# fixture-driven tests skip themselves, pass, and every mutant they guard is
# recorded as missed. `target/` is governed by `copy_target`, not this.
gitignore = false

exclude_globs = [
    # egui immediate-mode UI: painting, layout, and widget state only exist
    # inside a live frame. 1608 mutants, 8 caught at the time this was written.
    #
    # `egui_kittest` (https://github.com/emilk/egui/tree/main/crates/egui_kittest)
    # does let tests drive a real egui app; `ui/widgets.rs`, `ui/toolbar.rs` and
    # `ui/menubar.rs` now drive one through `ui/test_support.rs`. Measured result
    # on widgets.rs: 23 of 116 viable mutants caught, 20%. The split is sharp and
    # worth knowing before repeating the experiment:
    #
    #   caught  — return values, click routing, state mutation, format strings
    #   missed  — every paint parameter: colours, corner radii, stroke widths,
    #             text offsets. `gpu_pill`, `ctl_pill`, `tb_sep` and
    #             `field_label` return nothing and only paint, so even
    #             "replace <fn> with ()" survives.
    #
    # Killing paint mutants needs kittest's `snapshot`/`wgpu` features and
    # committed baseline images. Until that call is made, the painting modules
    # stay excluded so the reported score is not dominated by pixels no assertion
    # looks at. Run with `--no-config` to measure them anyway.
    #
    # `fcs-gui/src/interaction/` is deliberately NOT excluded: it is pure hit
    # testing and clamping arithmetic with no egui frame involved, it sits at
    # 100% line coverage, and its mutants are exactly the kind worth reporting.
    "fcs-gui/src/ui/**",
    "fcs-gui/src/core/**",
    "fcs-gui/src/rendering/**",
    # app.rs, types.rs, theme.rs, lib.rs, main.rs — the crate-root modules.
    "fcs-gui/src/*.rs",

    # These two genuinely need hardware in the loop: an enumerable camera and a
    # wgpu adapter. Every mutant survives because the code never runs in CI.
    "fcs-cli/src/webcam.rs",
    "fcs-cli/src/gpu.rs",
    # Same reason as the CLI's webcam module: the capture tests are #[ignore]d
    # without a camera, so its mutants all survive.
    "fcs-utils/src/webcam.rs",
]

# The auto timeout is baseline_test_time * 5, and the baseline runs alone while
# the mutants run four-wide against one GPU. Measured September 2026: fcs-utils
# baselined at 5.3 s (timeout 27 s) but its slowest *passing* mutant took 17.4 s,
# and fcs-core baselined at 11.4 s (timeout 57 s) with a passing mutant at 42.5 s.
# Three mutants were reported as timeouts whose tests had already printed FAILED
# — caught, recorded as timeout, because `cargo test` only exits when the binary
# does. A timeout reads as a missed mutant, so that is a silent loss.
#
# 120 s clears the measured tail on every package. The genuine hangs (the
# `rounded_polygon` angle loop, `validate_sql_query`'s backwards scan,
# `wait_for_gpu` with nothing polling) still stop here; they just cost 90 s more
# each, which is minutes across a run measured in hours.
minimum_test_timeout = 120
